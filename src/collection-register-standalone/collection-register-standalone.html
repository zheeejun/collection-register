<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<!-- Edit collection-register-standalone.css or utility classes, then run npm run build:standalone. -->
<link rel="stylesheet" href="./collection-register-standalone.generated.css">
</head>
<body class="m-0 bg-bg pt-7 pr-[max(16px,env(safe-area-inset-right,0px))] pb-[120px] pl-[max(16px,env(safe-area-inset-left,0px))] font-body text-sm leading-[1.55] text-ink">

<div class="wrap mx-auto max-w-[1000px]">
  <header class="top flex flex-wrap items-end justify-between gap-x-4 gap-y-2">
    <div>
      <h1 class="m-0 font-display text-[clamp(26px,5vw,34px)] leading-[1.2] font-bold tracking-[0.02em] text-balance">Collection</h1>
      <p class="sub mt-1 mb-0 text-sm text-muted tabular-nums" id="count">讀取中…</p>
    </div>
    <div class="status inline-flex min-h-7 items-center gap-2 text-[13px] text-muted" id="status" data-s="loading" role="status"><span class="dot size-2 flex-none rounded-full bg-muted"></span><span class="t">讀取中…</span></div>
  </header>

  <div class="bar mt-5 mb-3 flex flex-wrap items-center gap-2">
    <li-button type="button" class="btn primary" id="add" disabled>＋ 新增一列</li-button>
    <li-button type="button" class="btn" id="save" disabled>儲存</li-button>
    <li-button type="button" class="btn" id="copyAll" disabled title="以 Tab 分隔（書名、館藏地點、序號），可直接貼到 Excel">複製全部</li-button>
    <label class="opt inline-flex cursor-pointer items-center gap-2 text-sm text-muted max-[720px]:order-5 max-[720px]:basis-full" for="inc"><input type="checkbox" id="inc" class="m-0 size-4 accent-accent"> 複製列時，序號自動 +1</label>
    <span class="spacer flex-1 max-[720px]:hidden"></span>
    <li-button type="button" class="btn quiet" id="clear" disabled>全部清空</li-button>
  </div>

  <section class="export mt-0 mb-3 grid gap-2.5 rounded-lg border border-line bg-surface p-3.5 [&_p]:m-0 [&_p]:text-[13px] [&_p]:text-muted" id="exportBox" hidden>
    <p>瀏覽器沒有允許自動複製。請在下方文字按 Ctrl / ⌘ + C。</p>
    <textarea class="min-h-[120px] w-full resize-y rounded-md border border-line bg-field px-3 py-2.5 font-mono text-sm leading-[1.5] text-ink" id="exportText" readonly aria-label="可複製的內容"></textarea>
    <div><li-button type="button" class="btn" id="exportClose">關閉</li-button></div>
  </section>

  <p class="hint mt-0 mb-2.5 text-[13px] text-muted" id="hint" hidden>拖曳左側握把可調整順序，握把上按 ↑ ↓ 鍵也可以移動。館藏地點右側的 ▾ 可開啟地點清單。</p>
  <div class="cols-head grid grid-cols-(--cols) items-center gap-2.5 px-[13px] pb-1.5 text-xs tracking-[0.08em] text-muted max-[720px]:hidden" id="head" aria-hidden="true" hidden><span></span><span>#</span><span>書名</span><span>館藏地點</span><span>序號</span><span></span></div>
  <ol class="list m-0 grid list-none gap-2 p-0" id="list"></ol>

  <div class="empty grid justify-items-start gap-3 rounded-lg border border-dashed border-line-strong px-5 py-7 text-muted [&_h2]:m-0 [&_h2]:font-body [&_h2]:text-[17px] [&_h2]:leading-normal [&_h2]:font-bold [&_h2]:text-ink [&_p]:m-0 [&_p]:max-w-[46ch]" id="empty">
    <div id="emptyLoading"><h2>正在讀取已儲存的館藏</h2></div>
    <div id="emptyReady" hidden>
      <h2>還沒有館藏紀錄</h2>
      <p>每一列記錄一本館藏的書名、館藏地點和序號。新增後可以複製、刪除，或拖曳調整順序。</p>
      <li-button type="button" class="btn primary mt-3" id="addFirst">新增第一列</li-button>
    </div>
  </div>
</div>

<div class="menu fixed z-30 overflow-y-auto rounded-lg border border-line-strong bg-surface p-1 shadow-panel" id="locMenu" role="listbox" aria-label="館藏地點清單" hidden></div>
<div class="sr sr-only" id="sr" aria-live="polite"></div>
<div class="toast pointer-events-none fixed inset-x-0 bottom-0 z-40 flex justify-center pt-3 pr-[max(16px,env(safe-area-inset-right,0px))] pb-[calc(12px+env(safe-area-inset-bottom,0px))] pl-[max(16px,env(safe-area-inset-left,0px))]" id="toast">
  <div class="in pointer-events-auto flex max-w-[560px] items-center gap-4 rounded-lg bg-ink px-3.5 py-2.5 text-sm text-bg shadow-panel" role="status"><span class="msg"></span><li-button type="button" class="undo cursor-pointer border-0 bg-transparent px-0.5 py-1 font-body text-sm leading-normal font-bold text-toast-link underline" hidden>復原</li-button></div>
</div>

<template id="rowT">
  <li class="row grid grid-cols-(--cols) items-center gap-2.5 rounded-lg border border-line bg-surface px-3 py-2.5 max-[720px]:grid-cols-[auto_1fr_auto] max-[720px]:gap-y-2 max-[720px]:[grid-template-areas:'h_i_a'_'t_t_t'_'l_l_l'_'s_s_s']">
    <li-button type="button" class="handle grid h-11 w-8 touch-none cursor-grab place-items-center rounded-md border-0 bg-transparent p-0 text-muted select-none [-webkit-touch-callout:none] hover:bg-bg hover:text-ink max-[720px]:h-10 max-[720px]:[grid-area:h]" title="拖曳排序（也可按 ↑ ↓ 鍵）">
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><use href="./icons/DragHandleIcon.svg#DragHandleIcon"></use></svg>
    </li-button>
    <div class="idx flex flex-col items-start gap-0.5 font-mono text-[13px] leading-[1.2] text-muted tabular-nums max-[720px]:flex-row max-[720px]:items-center max-[720px]:gap-2 max-[720px]:[grid-area:i]"><span class="n"></span><span class="tag rounded-[3px] border border-accent-line bg-accent-soft px-[5px] py-0 font-body text-[10.5px] leading-4 font-medium text-accent" hidden>範例</span></div>
    <div class="f block min-w-0 ttl max-[720px]:[grid-area:t]"><label class="lbl mb-1 hidden text-xs tracking-[0.04em] text-muted max-[720px]:block">書名</label><input type="text" data-k="title" autocomplete="off" maxlength="300" placeholder="例：書名"></div>
    <div class="f block min-w-0 loc relative max-[720px]:[grid-area:l]">
      <label class="lbl mb-1 hidden text-xs tracking-[0.04em] text-muted max-[720px]:block">館藏地點</label>
      <input type="text" data-k="loc" role="combobox" aria-haspopup="listbox" aria-expanded="false" autocomplete="off" maxlength="200" placeholder="例：總館 3F 中文圖書區">
      <li-button type="button" class="chev absolute right-0.5 bottom-0.5 grid size-10 cursor-pointer place-items-center rounded-[5px] border-0 bg-transparent p-0 text-muted hover:bg-bg hover:text-ink" tabindex="-1" aria-label="開啟地點清單" title="地點清單">
        <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="./icons/ChevronDownIcon.svg#ChevronDownIcon"></use></svg>
      </li-button>
    </div>
    <div class="f block min-w-0 sn max-[720px]:[grid-area:s]"><label class="lbl mb-1 hidden text-xs tracking-[0.04em] text-muted max-[720px]:block">序號</label><input type="text" data-k="sn" autocomplete="off" spellcheck="false" maxlength="100" placeholder="例：884.157 3460"></div>
    <div class="acts flex gap-0.5 max-[720px]:[grid-area:a]">
      <li-button type="button" class="icon" data-act="dup" aria-label="複製這一列" title="複製這一列">
        <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="./icons/CopyIcon.svg#CopyIcon"></use></svg>
      </li-button>
      <li-button type="button" class="icon del" data-act="del" aria-label="刪除這一列" title="刪除這一列">
        <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="./icons/TrashIcon.svg#TrashIcon"></use></svg>
      </li-button>
    </div>
  </li>
</template>

<script src="./li-button.js"></script>
<script src="./collection-register-standalone.js"></script>

</body>
</html>
